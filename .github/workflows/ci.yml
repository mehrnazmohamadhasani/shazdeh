# Checks every pull request and push to main: types, lint, unit tests,
# all migrations on an empty Postgres, the seed, and a production build.
# A push to main that passes is then deployed to Vercel (see "deploy").
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shazdeh
          POSTGRES_PASSWORD: shazdeh
          POSTGRES_DB: shazdeh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shazdeh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shazdeh:shazdeh@localhost:5432/shazdeh
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0123
      ADMIN_EMAIL: ci@shazdeh.test
      ADMIN_PASSWORD: ci-only-password-123
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Migrations on an empty database
        run: npx prisma migrate deploy
      - name: Seed (twice — it must be safe to repeat)
        run: npm run db:seed && npm run db:seed
      - name: Production build
        run: npm run build

  # Vercel's own GitHub trigger stopped firing (Oct 2026), so a push to main
  # that passed "check" is deployed through a Vercel Deploy Hook (Project →
  # Settings → Git → Deploy Hooks, branch main), stored as the repository
  # secret VERCEL_DEPLOY_HOOK_URL. Without the secret this step does nothing.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger the Vercel production deployment
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set; not deploying."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
